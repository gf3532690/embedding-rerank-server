# Embedding & Rerank Server CPU 模式部署（v2.1 自适应引擎）
# 适用于无 GPU 的 AMD64 服务器
# 自动探测 CPU 核数并配置最优参数

services:
  embedding:
    container_name: ers-embedding
    image: embedding-rerank-server:cpu
    environment:
      - MODE=embed
      - EMBED_MODEL_PATH=/models/bge-m3
      - PORT=7997
    ports:
      - "7997:7997"
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7997/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  reranker:
    container_name: ers-reranker
    image: embedding-rerank-server:cpu
    environment:
      - MODE=rerank
      - RERANK_MODEL_PATH=/models/bge-reranker-v2-m3
      - PORT=7998
    ports:
      - "7998:7998"
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7998/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
