# ============================================================
# Embedding & Rerank Server 配置（CPU 模式 v2.0）
# ============================================================
# CPU 专用配置，覆盖部分自动探测值以获得最佳 CPU 性能。
# 大部分参数仍可使用 "auto"。

server:
  host: "0.0.0.0"
  port: 7997
  workers: 1

mode: "all"

models:
  embed:
    path: "/models/bge-m3"
    device: "cpu"
    fp16: false
    # CPU 模式建议缩短 max_length 以提升吞吐
    max_length: 1024
    engine: "onnx"

  rerank:
    path: "/models/bge-reranker-v2-m3"
    device: "cpu"
    fp16: false
    max_length: 512
    engine: "pytorch"

batching:
  # CPU 模式下 batch 不宜过大
  max_batch_size: "auto"
  max_batch_tokens: "auto"
  max_wait_ms: 50
  # CPU 模式可并行推理
  max_concurrency: "auto"
  backpressure_threshold: "auto"

warmup:
  enabled: true
  samples: 4
